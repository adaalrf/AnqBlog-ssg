<!DOCTYPE html>
<!-- here you set the default theme -->
<html data-theme="{{defaultTheme}}" data-themes="{{themesList}}" lang="{{siteLanguage}}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{siteDescription}}" />
  <meta name="robots" content="index, follow" />
  <title>{{title}}</title>
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{ogType}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{siteDescription}}" />
  <meta property="og:url" content="{{ogUrl}}" />
  <!-- Optional: Set ogImage in config or front matter to include og:image meta tag -->
  <!-- <meta property="og:image" content="{{ogImage}}" /> -->
  <!-- Optional: Set articlePublishedTime in front matter for article pages -->
  <!-- <meta property="article:published_time" content="{{articlePublishedTime}}" /> -->
  <!-- Optional: Set articleAuthor in config or front matter for article pages -->
  <!-- <meta property="article:author" content="{{articleAuthor}}" /> -->
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{siteDescription}}" />
  <!-- Optional: Set twitterImage in config or front matter to include twitter:image meta tag -->
  <!-- <meta name="twitter:image" content="{{twitterImage}}" /> -->
  <link rel="canonical" href="{{canonicalUrl}}" />
  <link href="{{stylesPath}}" rel="stylesheet" />
  <link rel="icon" href="{{faviconPath}}" type="image/x-icon" />
  <!-- Preload critical resources for better performance -->
  <link rel="preload" href="{{stylesPath}}" as="style" />
  <link rel="preload" href="{{scriptPath}}" as="script" />
</head>

<body class="bg-background flex flex-col min-h-screen">
  <!-- Skip to main content link for keyboard users -->
  <a href="#main" class="skip-link">
    Skip to main content
  </a>
  <header
    class="sticky top-0 z-10 bg-background/95 backdrop-blur-sm text-foreground border-b border-border shadow-sm transition-shadow duration-200 ease-in-out">
    <div class="sm:hidden flex items-center justify-between px-4 py-3">
      <ul class="flex items-center m-0 p-0">
        <li class="relative">
          <button type="button" data-hook="menu-toggle" aria-label="Toggle menu" aria-expanded="false"
            class="flex items-center"></button>
          <ul data-hook="menu-dropdown"
            class="flex flex-col gap-3 absolute left-0 mt-3 p-4 transform min-w-40 w-fit bg-background border border-border rounded-sm shadow-xl z-20 dropdown-menu opacity-0 -translate-y-2 invisible before:absolute before:-top-5 before:left-0 before:right-0 before:h-5 before:bg-transparent">
            <li class="dropdown-item"><a href="/" class="block py-1.5 px-1 rounded-sm focus-ring">Home</a></li>
            <li class="dropdown-item"><a href="/blog" class="block py-1.5 px-1 rounded-sm focus-ring">Blog</a></li>
            <li class="dropdown-item"><a href="/blog/tags" class="block py-1.5 px-1 rounded-sm focus-ring">Tags</a></li>
            <li class="dropdown-item">
              <a href="{{githubUrl}}" target="_blank" rel="noopener noreferrer"
                class="block py-1.5 px-1 rounded-sm focus-ring">gitHub</a>
            </li>
            <li class="dropdown-item">
              <button data-hook="theme-toggle-mobile" type="button" class="hidden w-full text-left nav-link"
                aria-label="Toggle theme">
                <!-- Toggle Theme Mobile -->
              </button>
            </li>
          </ul>
        </li>
      </ul>
      <a href="/"
        class="hover:opacity-80 transition-opacity duration-200 ease-in-out focus-ring rounded-sm flex items-center">
        <h1 class="text-xl font-bold m-0 p-0 tracking-tight leading-tight">{{siteName}}</h1>
      </a>
    </div>
    <div class="hidden sm:flex flex-col md:flex-row md:items-center justify-between page-width mx-auto gap-3 px-4 py-3">
      <div class="flex items-center min-w-0 flex-1 gap-3">
        <a href="/"
          class="shrink-0 hover:opacity-80 transition-opacity duration-200 ease-in-out focus-ring rounded-sm flex items-center">
          <h1 class="text-xl font-bold m-0 p-0 tracking-tight leading-tight">{{siteName}}</h1>
        </a>
        <nav aria-label="Breadcrumb"
          class="text-base sm:text-lg font-medium m-0 overflow-hidden whitespace-nowrap text-ellipsis min-w-0 max-w-md text-muted-foreground flex items-center">
          {{page}}
        </nav>
      </div>
      <nav class="shrink-0 flex items-center" aria-label="Main navigation">
        <ul class="flex space-x-4 items-center m-0 p-0">
          <li>
            <a href="/" class="nav-link">Home</a>
          </li>
          <li>
            <a href="/blog" class="nav-link">Blog</a>
          </li>
          <li class="relative hidden sm:block">
            <a href="/blog/tags" data-hook="tags-dropdown-toggle" aria-expanded="false" aria-haspopup="true" class="nav-link">Tags</a>
            <ul data-hook="tags-dropdown-menu"
              class="flex flex-col gap-2 absolute left-1/2 mt-3 p-3 transform -translate-x-1/2 min-w-40 w-fit bg-background border border-border rounded-sm shadow-xl z-20 dropdown-menu opacity-0 -translate-y-2 invisible before:absolute before:-top-5 before:left-0 before:right-0 before:h-5 before:bg-transparent">
              {{tagsDropdown}}
            </ul>
          </li>
          <li>
            <a href="{{githubUrl}}" target="_blank" rel="noopener noreferrer" class="nav-link">gitHub</a>
          </li>
          <li class="shrink-0">
            <button data-hook="theme-toggle" type="button" class="hidden nav-link" aria-label="Toggle theme">
              <!-- Toggle Theme -->
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="page-width mx-2 sm:mx-auto mt-8 mb-8 grow" aria-label="Main content">
    <div class="card p-6 sm:p-8">
      {{children}}
    </div>
  </main>
  <footer class="bg-background/50 border-t border-border mt-auto py-6 transition-colors duration-200 ease-in-out">
    <div class="page-width mx-auto text-center px-4">
      <p class="text-muted-foreground text-sm">
        © {{copyrightYear}} . <a href="{{githubUrl}}" target="_blank" rel="noopener noreferrer"
          class="hover:text-accent transition-colors duration-200 ease-in-out inline-flex items-center gap-1 focus-ring rounded-sm">{{authorName}}
          <img src="{{gitLogoPath}}" alt=""
            class="inline-block w-4 h-4 opacity-70 transition-opacity duration-200 ease-in-out" aria-hidden="true" />
        </a>
      </p>
    </div>
  </footer>
  <script type="module" src="{{scriptPath}}"></script>
</body>

</html>
